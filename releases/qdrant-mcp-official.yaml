---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-mcp-official
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    cmd: uvx
    args:
      - mcp-server-qdrant
    env:
      QDRANT_URL: http://qdrant.qdrant:6333
      COLLECTION_NAME: abox-minilm
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi